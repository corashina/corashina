name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Start from the last published files, so a failed step never blanks a card.
      - name: Restore previous output
        run: |
          mkdir -p dist
          if git fetch --depth=1 origin output; then
            git --work-tree=dist checkout FETCH_HEAD -- . || true
          fi

      - name: Languages and contribution cards
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/build-cards.mjs --out dist

      - name: Contribution eel
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/eel.svg?color_snake=#ff8a3d&color_dots=#0b1518,#3a2216,#6e3517,#b85a22,#ff8a3d&color_dot_border=#00000000

      - name: Check SVGs
        run: node scripts/check.mjs dist/*.svg

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
